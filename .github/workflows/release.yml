name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Name the installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Get-ChildItem "dist/GameCenter-*-setup.exe" |
            Rename-Item -NewName "GameCenter-$v-windows-setup.exe"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: GameCenter-windows
          path: dist/GameCenter-*-windows-setup.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GameCenter-*-windows-setup.exe
          generate_release_notes: true
